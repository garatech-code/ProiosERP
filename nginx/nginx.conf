events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # ¡VITAL! Aumenta el límite de tamaño para permitir la subida de imágenes/archivos a Django
    client_max_body_size 50M;

    # Nginx configuration for production-ready (and dev-friendly) reverse proxy
    server {
        listen 80;
        server_name localhost;

        # Frontend: Redirigir la ruta raíz a Vite
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte para WebSockets (Necesario para el Hot Reload de Vite)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend: Agrupamos las rutas /api/ y /admin/ hacia Django usando una expresión regular
        location ~ ^/(api|admin) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Archivos estáticos de Django
        location /static/ {
            alias /app/static/;
            # Opcional pero recomendado: Cachear estáticos para mejor rendimiento
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Media de Django (Archivos subidos por los usuarios)
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }
}